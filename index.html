<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Social Pro: Profiles & Walls</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, setDoc, doc, updateDoc, increment, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCgB37v5kwWeYBNmkGIojTqgl_iMe4Yxfc",
            authDomain: "mlbb-hero-pick-helper.firebaseapp.com",
            projectId: "mlbb-hero-pick-helper",
            storageBucket: "mlbb-hero-pick-helper.firebasestorage.app",
            messagingSenderId: "848029333314",
            appId: "1:848029333314:web:c1c3ccacb9a5a0050ebadb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('mlbb_pro_v2')) || null;
        let viewMode = 'feed'; // feed, profile, wall

        window.onload = () => {
            if(!currentUser) document.getElementById('loginModal').classList.remove('hidden');
            else {
                syncUserToDB();
                showTab('feed');
            }
        };

        async function syncUserToDB() {
            await setDoc(doc(db, "users", currentUser.id), currentUser, { merge: true });
        }

        window.joinApp = () => {
            const name = document.getElementById('nickName').value;
            if(!name) return;
            currentUser = { id: "u" + Date.now(), name, avatar: document.getElementById('avatar').value, bio: "MLBB Player" };
            localStorage.setItem('mlbb_pro_v2', JSON.stringify(currentUser));
            location.reload();
        };

        // --- NAVIGATION & TABS ---
        window.showTab = (tab, targetUserId = null) => {
            viewMode = tab;
            document.getElementById('feedSection').classList.add('hidden');
            document.getElementById('profileSection').classList.add('hidden');
            document.getElementById('wallSection').classList.add('hidden');

            if(tab === 'feed') {
                document.getElementById('feedSection').classList.remove('hidden');
                loadPosts();
            } else if(tab === 'profile') {
                document.getElementById('profileSection').classList.remove('hidden');
                loadMyProfile();
            } else if(tab === 'wall') {
                document.getElementById('wallSection').classList.remove('hidden');
                loadUserWall(targetUserId);
            }
        };

        // --- POST SYSTEM ---
        window.createPost = async () => {
            const text = document.getElementById('postText').value;
            if(!text) return;
            await addDoc(collection(db, "posts"), {
                text, authorId: currentUser.id, authorName: currentUser.name, 
                avatar: currentUser.avatar, likes: 0, time: serverTimestamp()
            });
            document.getElementById('postText').value = "";
        };

        function loadPosts(filterUserId = null) {
            const q = filterUserId 
                ? query(collection(db, "posts"), where("authorId", "==", filterUserId), orderBy("time", "desc"))
                : query(collection(db, "posts"), orderBy("time", "desc"));
            
            onSnapshot(q, (snap) => {
                const target = filterUserId ? 'wallPosts' : 'feedArea';
                const container = document.getElementById(target);
                container.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    container.innerHTML += `
                        <div class="bg-slate-900 p-4 rounded-3xl mb-4 border border-slate-800 shadow-xl">
                            <div class="flex items-center gap-2 mb-3 cursor-pointer" onclick="showTab('wall', '${p.authorId}')">
                                <span class="text-2xl">${p.avatar}</span>
                                <span class="font-bold text-cyan-400 text-sm">${p.authorName}</span>
                            </div>
                            <p class="text-sm text-slate-300 mb-3">${p.text}</p>
                            <button onclick="addLike('${d.id}')" class="text-[10px] bg-slate-800 px-3 py-1 rounded-full">❤️ ${p.likes || 0}</button>
                        </div>`;
                });
            });
        }

        window.addLike = async (id) => {
            await updateDoc(doc(db, "posts", id), { likes: increment(1) });
        };

        // --- PROFILE & WALL LOGIC ---
        function loadMyProfile() {
            document.getElementById('myAvatar').innerText = currentUser.avatar;
            document.getElementById('myName').innerText = currentUser.name;
            document.getElementById('myBio').innerText = currentUser.bio;
        }

        async function loadUserWall(userId) {
            onSnapshot(doc(db, "users", userId), (d) => {
                const u = d.data();
                document.getElementById('wallAvatar').innerText = u.avatar;
                document.getElementById('wallName').innerText = u.name;
                document.getElementById('wallBio').innerText = u.bio;
            });
            loadPosts(userId);
        }

    </script>
</head>
<body class="bg-[#020617] text-white max-w-md mx-auto h-screen flex flex-col font-sans">

    <div id="loginModal" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-8 rounded-[2.5rem] w-full border border-slate-800 text-center shadow-2xl">
            <h2 class="text-xl font-black mb-6 text-cyan-400">CREATE PROFILE</h2>
            <select id="avatar" class="w-full bg-slate-800 p-4 rounded-2xl mb-4 text-3xl outline-none border border-slate-700">
                <option value="🥷">🥷</option><option value="🏹">🏹</option><option value="🧙‍♂️">🧙‍♂️</option><option value="🛡️">🛡️</option>
            </select>
            <input type="text" id="nickName" placeholder="နာမည်..." class="w-full bg-slate-800 p-4 rounded-2xl mb-6 outline-none border border-slate-700">
            <button onclick="joinApp()" class="w-full bg-cyan-500 text-slate-950 py-4 rounded-2xl font-black">START JOURNEY</button>
        </div>
    </div>

    <header class="p-5 flex justify-between items-center bg-slate-950/80 backdrop-blur sticky top-0 z-50 border-b border-slate-900">
        <h1 class="text-lg font-black italic text-cyan-500" onclick="showTab('feed')">MLBB WORLD</h1>
        <div class="text-[10px] font-bold bg-slate-800 px-3 py-1 rounded-full cursor-pointer" onclick="showTab('profile')">My Profile</div>
    </header>

    <main class="flex-1 overflow-y-auto">
        <section id="feedSection" class="p-5 hidden">
            <div class="bg-slate-900 p-4 rounded-3xl mb-6 border border-slate-800">
                <textarea id="postText" placeholder="ဘာတွေပြောချင်လဲ..." class="w-full bg-transparent outline-none text-sm h-16 resize-none mb-2"></textarea>
                <button onclick="createPost()" class="w-full bg-cyan-600 py-3 rounded-xl text-xs font-black shadow-lg">POST</button>
            </div>
            <div id="feedArea"></div>
        </section>

        <section id="profileSection" class="p-8 text-center hidden">
            <div id="myAvatar" class="text-7xl mb-4">👤</div>
            <h2 id="myName" class="text-2xl font-black text-cyan-400 mb-2">User</h2>
            <p id="myBio" class="text-sm text-slate-500 mb-6">Bio here...</p>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <p class="text-[10px] text-slate-500 font-bold">FOLLOWERS</p>
                    <p class="text-xl font-black">0</p>
                </div>
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <p class="text-[10px] text-slate-500 font-bold">FOLLOWING</p>
                    <p class="text-xl font-black">0</p>
                </div>
            </div>
        </section>

        <section id="wallSection" class="hidden">
            <div class="p-8 text-center bg-slate-900/50 border-b border-slate-900">
                <div id="wallAvatar" class="text-6xl mb-3">👤</div>
                <h2 id="wallName" class="text-xl font-black text-white">Name</h2>
                <p id="wallBio" class="text-xs text-slate-500 mb-4 italic">Bio...</p>
                <button class="bg-cyan-500 text-slate-950 px-6 py-2 rounded-full font-black text-xs">Message</button>
            </div>
            <div class="p-5">
                <h3 class="text-[10px] font-black text-slate-500 mb-4 uppercase tracking-widest">User's Posts</h3>
                <div id="wallPosts"></div>
            </div>
        </section>
    </main>

    <nav class="bg-slate-950/90 border-t border-slate-900 p-4 flex justify-around text-[10px] font-black sticky bottom-0 z-50">
        <button onclick="showTab('feed')" class="text-cyan-500">🏠 HOME</button>
        <button onclick="showTab('profile')" class="text-slate-500">👤 PROFILE</button>
    </nav>

</body>
</html>
