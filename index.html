<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Pro Social AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- သင့် Firebase Config ကို ဒီမှာ ပြန်ထည့်ပါ ---
        const firebaseConfig = {
            apiKey: "AIzaSyCgB37v5kwWeYBNmkGIojTqgl_iMe4Yxfc",
            authDomain: "mlbb-hero-pick-helper.firebaseapp.com",
            projectId:"mlbb-hero-pick-helper",
            storageBucket: "mlbb-hero-pick-helper.firebasestorage.app",
            messagingSenderId:"848029333314,
            appId:"1:848029333314:web:c1c3ccacb9a5a0050ebadb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- USER PROFILE LOGIC ---
        let currentUser = JSON.parse(localStorage.getItem('mlbb_user')) || null;

        window.onload = () => {
            if (!currentUser) {
                document.getElementById('profileModal').classList.remove('hidden');
            } else {
                updateUI();
            }
        };

        window.saveProfile = () => {
            const name = document.getElementById('userNameInput').value;
            const avatar = document.getElementById('avatarSelect').value;
            if(!name) return alert("နာမည်ထည့်ပါ");
            currentUser = { name, avatar };
            localStorage.setItem('mlbb_user', JSON.stringify(currentUser));
            document.getElementById('profileModal').classList.add('hidden');
            updateUI();
        };

        function updateUI() {
            document.getElementById('userDisplay').innerText = currentUser.name;
            document.getElementById('avatarDisplay').innerText = currentUser.avatar;
        }

        // --- POST & LIKE LOGIC ---
        window.createPost = async () => {
            const text = document.getElementById('postText').value;
            if(!text || !currentUser) return;
            await addDoc(collection(db, "posts"), {
                text: text,
                userName: currentUser.name,
                userAvatar: currentUser.avatar,
                likes: 0,
                timestamp: serverTimestamp()
            });
            document.getElementById('postText').value = "";
            showNoti("Post တင်ပြီးပါပြီ!");
        };

        window.likePost = async (postId) => {
            const postRef = doc(db, "posts", postId);
            await updateDoc(postRef, { likes: increment(1) });
        };

        // Real-time Feed with Noti
        let firstLoad = true;
        onSnapshot(query(collection(db, "posts"), orderBy("timestamp", "desc")), (snapshot) => {
            const container = document.getElementById('postContainer');
            if(!firstLoad && snapshot.docChanges().some(change => change.type === "added")) {
                showNoti("Post အသစ်တစ်ခု ရောက်လာပါတယ်!");
            }
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-4 rounded-2xl mb-4 border border-slate-700 shadow-lg";
                card.innerHTML = `
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 bg-cyan-900 rounded-full flex items-center justify-center text-xl">${data.userAvatar || '👤'}</div>
                        <div>
                            <p class="font-bold text-cyan-400 text-sm">${data.userName || 'Unknown'}</p>
                            <p class="text-[10px] text-slate-500">Just now</p>
                        </div>
                    </div>
                    <p class="text-sm mb-4 leading-relaxed">${data.text}</p>
                    <div class="flex items-center gap-4 border-t border-slate-700 pt-3">
                        <button onclick="likePost('${doc.id}')" class="flex items-center gap-1 text-xs font-bold text-slate-400 hover:text-pink-500 transition-colors">
                            ❤️ <span>${data.likes || 0}</span> Likes
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
            firstLoad = false;
        });

        function showNoti(msg) {
            const noti = document.getElementById('notiBar');
            noti.innerText = msg;
            noti.classList.remove('-translate-y-20');
            setTimeout(() => noti.classList.add('-translate-y-20'), 3000);
        }
    </script>
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: #0f172a; border: 1px solid #1e293b; }
    </style>
</head>
<body class="max-w-md mx-auto pb-10">

    <div id="notiBar" class="fixed top-4 left-1/2 -translate-x-1/2 bg-cyan-500 text-slate-900 px-6 py-2 rounded-full font-bold shadow-2xl transition-transform duration-500 -translate-y-20 z-[100] text-sm">
        Notification!
    </div>

    <div id="profileModal" class="fixed inset-0 bg-slate-950/90 flex items-center justify-center z-[90] p-6 hidden">
        <div class="glass p-8 rounded-3xl w-full text-center">
            <h2 class="text-2xl font-black mb-4">Create Profile</h2>
            <select id="avatarSelect" class="w-full bg-slate-900 p-3 rounded-xl mb-4 text-3xl">
                <option value="🥷">🥷 Ninja</option>
                <option value="🧙‍♂️">🧙‍♂️ Mage</option>
                <option value="🏹">🏹 Marksman</option>
                <option value="🛡️">🛡️ Tank</option>
                <option value="⚔️">⚔️ Fighter</option>
            </select>
            <input type="text" id="userNameInput" placeholder="သင့်နာမည်..." class="w-full bg-slate-900 p-4 rounded-xl mb-6 border border-slate-700 outline-none">
            <button onclick="saveProfile()" class="w-full bg-cyan-500 py-4 rounded-2xl font-bold text-slate-900">အသုံးပြုမယ်</button>
        </div>
    </div>

    <header class="p-6 flex justify-between items-center bg-slate-900/50 sticky top-0 z-40 backdrop-blur">
        <div>
            <h1 class="text-xl font-black italic text-cyan-400">MLBB SOCIAL</h1>
            <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Connected to Firebase</p>
        </div>
        <div class="flex items-center gap-2 bg-slate-800 p-2 rounded-xl border border-slate-700">
            <span id="avatarDisplay" class="text-lg">👤</span>
            <span id="userDisplay" class="text-xs font-bold">User</span>
        </div>
    </header>

    <div class="p-6">
        <div class="glass p-4 rounded-3xl mb-8">
            <textarea id="postText" placeholder="ဘာတွေတွေးနေလဲ..." rows="3" class="w-full bg-transparent outline-none resize-none text-sm mb-2"></textarea>
            <button onclick="createPost()" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 py-3 rounded-xl font-black shadow-lg">POST တင်မယ်</button>
        </div>

        <div id="postContainer" class="space-y-4">
            </div>
    </div>

</body>
</html>
