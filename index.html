<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Ultimate Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Config (သင့်ရဲ့ Screenshot ပါ အချက်အလက်များ)
        const firebaseConfig = {
            apiKey: "AIzaSyCgB37v5kwWeYBNmkGIojTqgl_iMe4Yxfc",
            authDomain: "mlbb-hero-pick-helper.firebaseapp.com",
            projectId: "mlbb-hero-pick-helper",
            storageBucket: "mlbb-hero-pick-helper.firebasestorage.app",
            messagingSenderId: "848029333314",
            appId: "1:848029333314:web:c1c3ccacb9a5a0050ebadb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let user = JSON.parse(localStorage.getItem('mlbb_pro_user')) || null;

        window.onload = () => {
            if(!user) document.getElementById('loginModal').classList.remove('hidden');
            else updateProfileUI();
        };

        window.saveUser = () => {
            const name = document.getElementById('nickName').value;
            if(!name) return;
            user = { name, avatar: document.getElementById('avatar').value };
            localStorage.setItem('mlbb_pro_user', JSON.stringify(user));
            document.getElementById('loginModal').classList.add('hidden');
            updateProfileUI();
        };

        function updateProfileUI() {
            document.getElementById('navUser').innerText = user.name;
            document.getElementById('navAvatar').innerText = user.avatar;
        }

        // --- POST WITH IMAGE & REACTS ---
        window.createPost = async () => {
            const text = document.getElementById('postText').value;
            const imgFile = document.getElementById('postImg').files[0];
            let imgData = "";

            if(imgFile) {
                const reader = new FileReader();
                reader.onloadend = async () => {
                    imgData = reader.result;
                    await sendToFirebase(text, imgData);
                };
                reader.readAsDataURL(imgFile);
            } else if(text) {
                await sendToFirebase(text, "");
            }
        };

        async function sendToFirebase(t, i) {
            await addDoc(collection(db, "posts"), {
                text: t, image: i, author: user.name, avatar: user.avatar,
                reacts: { like: 0, love: 0, haha: 0 }, time: serverTimestamp()
            });
            document.getElementById('postText').value = "";
            document.getElementById('postImg').value = "";
        }

        window.addReact = async (id, type) => {
            const ref = doc(db, "posts", id);
            const updateObj = {};
            updateObj[`reacts.${type}`] = increment(1);
            await updateDoc(ref, updateObj);
        };

        onSnapshot(query(collection(db, "posts"), orderBy("time", "desc")), (snap) => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                feed.innerHTML += `
                    <div class="bg-slate-900 p-4 rounded-3xl mb-4 border border-slate-800 shadow-xl">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-2xl">${p.avatar}</span>
                            <span class="font-bold text-cyan-400">${p.author}</span>
                        </div>
                        <p class="text-sm mb-3">${p.text}</p>
                        ${p.image ? `<img src="${p.image}" class="rounded-2xl mb-3 w-full border border-slate-700">` : ''}
                        <div class="flex gap-2 border-t border-slate-800 pt-3">
                            <button onclick="addReact('${d.id}', 'like')" class="bg-slate-800 px-3 py-1 rounded-full text-xs">👍 ${p.reacts?.like || 0}</button>
                            <button onclick="addReact('${d.id}', 'love')" class="bg-slate-800 px-3 py-1 rounded-full text-xs">❤️ ${p.reacts?.love || 0}</button>
                            <button onclick="addReact('${d.id}', 'haha')" class="bg-slate-800 px-3 py-1 rounded-full text-xs">😂 ${p.reacts?.haha || 0}</button>
                        </div>
                    </div>`;
            });
        });

        // --- REAL-TIME CHAT ---
        window.sendChat = async () => {
            const msg = document.getElementById('chatInput').value;
            if(!msg) return;
            await addDoc(collection(db, "chats"), { msg, sender: user.name, time: serverTimestamp() });
            document.getElementById('chatInput').value = "";
        };

        onSnapshot(query(collection(db, "chats"), orderBy("time", "asc")), (snap) => {
            const box = document.getElementById('chatBox');
            box.innerHTML = "";
            snap.forEach(d => {
                const c = d.data();
                box.innerHTML += `<div class="mb-2 text-xs"><b class="text-cyan-500">${c.sender}:</b> ${c.msg}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        });

        window.showTab = (t) => {
            document.getElementById('feedTab').classList.toggle('hidden', t !== 'feed');
            document.getElementById('chatTab').classList.toggle('hidden', t !== 'chat');
        };
    </script>
</head>
<body class="bg-slate-950 text-white max-w-md mx-auto font-sans pb-20">

    <div id="loginModal" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-8 rounded-[2.5rem] w-full text-center border border-slate-800">
            <h2 class="text-2xl font-black mb-6 text-cyan-400">Join Community</h2>
            <select id="avatar" class="w-full bg-slate-800 p-4 rounded-2xl mb-4 text-3xl">
                <option value="🥷">🥷</option><option value="🏹">🏹</option><option value="🧙‍♂️">🧙‍♂️</option>
            </select>
            <input type="text" id="nickName" placeholder="နာမည်..." class="w-full bg-slate-800 p-4 rounded-2xl mb-6 outline-none">
            <button onclick="saveUser()" class="w-full bg-cyan-500 text-slate-950 py-4 rounded-2xl font-black">START</button>
        </div>
    </div>

    <header class="p-6 sticky top-0 bg-slate-950/90 backdrop-blur z-50 flex justify-between items-center border-b border-slate-900">
        <h1 class="text-xl font-black italic text-cyan-500">MLBB HUB</h1>
        <div class="flex gap-2 text-xs font-bold bg-slate-900 px-3 py-1 rounded-full border border-slate-800">
            <span id="navAvatar"></span> <span id="navUser"></span>
        </div>
    </header>

    <div id="feedTab" class="p-6">
        <div class="bg-slate-900 p-5 rounded-[2rem] mb-6 border border-slate-800 shadow-2xl">
            <textarea id="postText" placeholder="ဘာတွေပြောချင်လဲ..." class="w-full bg-transparent outline-none text-sm h-20 mb-3"></textarea>
            <input type="file" id="postImg" accept="image/*" class="text-[10px] mb-4 block text-slate-500">
            <button onclick="createPost()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 py-4 rounded-2xl font-black shadow-lg">POST</button>
        </div>
        <div id="feed"></div>
    </div>

    <div id="chatTab" class="p-6 hidden h-[80vh] flex flex-col">
        <div id="chatBox" class="flex-1 bg-slate-900 rounded-3xl p-4 overflow-y-auto mb-4 border border-slate-800"></div>
        <div class="flex gap-2">
            <input type="text" id="chatInput" placeholder="စာရိုက်ပါ..." class="flex-1 bg-slate-900 p-4 rounded-2xl outline-none border border-slate-800">
            <button onclick="sendChat()" class="bg-cyan-600 px-6 rounded-2xl font-bold">SEND</button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/90 border-t border-slate-900 p-4 flex justify-around text-xs font-black z-50 max-w-md mx-auto">
        <button onclick="showTab('feed')" class="text-cyan-500">FEED</button>
        <button onclick="showTab('chat')" class="text-slate-500">CHAT</button>
    </nav>
</body>
</html>
