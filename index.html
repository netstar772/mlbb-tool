<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Hub: Post & Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, setDoc, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCgB37v5kwWeYBNmkGIojTqgl_iMe4Yxfc",
            authDomain: "mlbb-hero-pick-helper.firebaseapp.com",
            projectId: "mlbb-hero-pick-helper",
            storageBucket: "mlbb-hero-pick-helper.firebasestorage.app",
            messagingSenderId: "848029333314",
            appId: "1:848029333314:web:c1c3ccacb9a5a0050ebadb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let user = JSON.parse(localStorage.getItem('mlbb_ultra_user')) || null;
        let activeTab = 'feed';

        window.onload = () => {
            if(!user) document.getElementById('loginModal').classList.remove('hidden');
            else {
                updateUI();
                listenFeed();
                listenChats();
                syncUsers();
            }
        };

        window.joinApp = async () => {
            const name = document.getElementById('nickName').value;
            if(!name) return;
            user = { id: Date.now().toString(), name, avatar: document.getElementById('avatar').value };
            localStorage.setItem('mlbb_ultra_user', JSON.stringify(user));
            await setDoc(doc(db, "users", user.id), { ...user, status: "online" });
            location.reload();
        };

        function updateUI() {
            document.getElementById('navUser').innerText = user.name;
            document.getElementById('navAvatar').innerText = user.avatar;
        }

        // --- FEED SYSTEM (POST WITH IMAGE & REACT) ---
        window.createPost = async () => {
            const text = document.getElementById('postText').value;
            const imgFile = document.getElementById('postImg').files[0];
            let imgData = "";

            if(imgFile) {
                const reader = new FileReader();
                reader.onloadend = async () => {
                    imgData = reader.result;
                    await savePost(text, imgData);
                };
                reader.readAsDataURL(imgFile);
            } else if(text) {
                await savePost(text, "");
            }
        };

        async function savePost(t, i) {
            await addDoc(collection(db, "posts"), {
                text: t, image: i, author: user.name, avatar: user.avatar,
                reacts: { like: 0, love: 0, haha: 0 }, time: serverTimestamp()
            });
            document.getElementById('postText').value = "";
            document.getElementById('postImg').value = "";
        }

        window.addReact = async (id, type) => {
            const ref = doc(db, "posts", id);
            const upd = {}; upd[`reacts.${type}`] = increment(1);
            await updateDoc(ref, upd);
        };

        function listenFeed() {
            onSnapshot(query(collection(db, "posts"), orderBy("time", "desc")), (snap) => {
                const feed = document.getElementById('feedArea');
                feed.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    feed.innerHTML += `
                        <div class="bg-slate-900 p-4 rounded-3xl mb-4 border border-slate-800 shadow-xl">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="text-2xl">${p.avatar}</span>
                                <span class="font-bold text-cyan-400 text-sm">${p.author}</span>
                            </div>
                            <p class="text-sm mb-3 text-slate-300">${p.text}</p>
                            ${p.image ? `<img src="${p.image}" class="rounded-2xl mb-3 w-full border border-slate-700">` : ''}
                            <div class="flex gap-2 border-t border-slate-800 pt-3">
                                <button onclick="addReact('${d.id}', 'like')" class="bg-slate-800 px-3 py-1 rounded-full text-[10px]">👍 ${p.reacts?.like || 0}</button>
                                <button onclick="addReact('${d.id}', 'love')" class="bg-slate-800 px-3 py-1 rounded-full text-[10px]">❤️ ${p.reacts?.love || 0}</button>
                                <button onclick="addReact('${d.id}', 'haha')" class="bg-slate-800 px-3 py-1 rounded-full text-[10px]">😂 ${p.reacts?.haha || 0}</button>
                            </div>
                        </div>`;
                });
            });
        }

        // --- CHAT SYSTEM ---
        window.sendChat = async () => {
            const msg = document.getElementById('chatInput').value;
            if(!msg) return;
            await addDoc(collection(db, "messages"), {
                text: msg, sender: user.name, senderId: user.id, time: serverTimestamp()
            });
            document.getElementById('chatInput').value = "";
        };

        function listenChats() {
            onSnapshot(query(collection(db, "messages"), orderBy("time", "asc")), (snap) => {
                const box = document.getElementById('chatBox');
                box.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const isMe = m.senderId === user.id;
                    box.innerHTML += `
                        <div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-3">
                            <div class="${isMe ? 'bg-cyan-600 rounded-l-xl rounded-tr-xl' : 'bg-slate-800 rounded-tl-xl rounded-r-xl'} p-3 max-w-[70%]">
                                <p class="text-[9px] font-bold opacity-50 mb-1">${m.sender}</p>
                                <p class="text-xs">${m.text}</p>
                            </div>
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function syncUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('userList');
                list.innerHTML = "";
                snap.forEach(d => {
                    const u = d.data();
                    list.innerHTML += `<div class="flex items-center gap-2 mb-3 grayscale hover:grayscale-0 cursor-pointer transition-all">
                        <span class="text-xl">${u.avatar}</span>
                        <span class="text-[10px] font-bold text-slate-400">${u.name}</span>
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full ml-auto"></span>
                    </div>`;
                });
            });
        }

        window.showTab = (tab) => {
            document.getElementById('feedSection').classList.toggle('hidden', tab !== 'feed');
            document.getElementById('chatSection').classList.toggle('hidden', tab !== 'chat');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('text-cyan-500', 'text-slate-500'));
            document.getElementById('btn-' + tab).classList.replace('text-slate-500', 'text-cyan-500');
        };
    </script>
</head>
<body class="bg-[#020617] text-white max-w-md mx-auto h-screen flex flex-col font-sans">

    <div id="loginModal" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-8 rounded-[2rem] w-full border border-slate-800 text-center">
            <h2 class="text-xl font-black mb-6 text-cyan-400 uppercase tracking-tighter">Initialize MLBB Hub</h2>
            <select id="avatar" class="w-full bg-slate-800 p-4 rounded-2xl mb-4 text-3xl outline-none border border-slate-700">
                <option value="🥷">🥷</option><option value="🏹">🏹</option><option value="🧙‍♂️">🧙‍♂️</option><option value="🛡️">🛡️</option>
            </select>
            <input type="text" id="nickName" placeholder="နာမည်..." class="w-full bg-slate-800 p-4 rounded-2xl mb-6 outline-none border border-slate-700">
            <button onclick="joinApp()" class="w-full bg-cyan-500 text-slate-950 py-4 rounded-2xl font-black">ENTER HUB</button>
        </div>
    </div>

    <header class="p-5 flex justify-between items-center border-b border-slate-900 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <h1 class="text-lg font-black italic text-cyan-500 tracking-tight">MLBB HUB</h1>
        <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800 text-[10px] font-bold">
            <span id="navAvatar"></span> <span id="navUser"></span>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto">
        <section id="feedSection" class="p-5">
            <div class="bg-slate-900 p-4 rounded-3xl mb-6 border border-slate-800">
                <textarea id="postText" placeholder="ဘာတွေတွေးနေလဲ..." class="w-full bg-transparent outline-none text-sm h-20 mb-2 resize-none"></textarea>
                <div class="flex justify-between items-center">
                    <input type="file" id="postImg" accept="image/*" class="text-[9px] text-slate-500 w-1/2">
                    <button onclick="createPost()" class="bg-cyan-600 px-6 py-2 rounded-xl text-xs font-black shadow-lg active:scale-95 transition-all">POST</button>
                </div>
            </div>
            <div id="feedArea"></div>
        </section>

        <section id="chatSection" class="hidden h-full flex flex-col p-5">
            <div class="flex gap-4 flex-1 overflow-hidden">
                <div id="userList" class="w-12 border-r border-slate-900 pr-2 overflow-y-auto"></div>
                <div class="flex-1 flex flex-col overflow-hidden">
                    <div id="chatBox" class="flex-1 overflow-y-auto mb-4 space-y-2 pr-2"></div>
                    <div class="flex gap-2 bg-slate-900 p-2 rounded-2xl border border-slate-800">
                        <input type="text" id="chatInput" placeholder="စာရိုက်ပါ..." class="flex-1 bg-transparent p-2 outline-none text-xs">
                        <button onclick="sendChat()" class="bg-cyan-600 px-4 py-2 rounded-xl font-bold text-[10px]">SEND</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <nav class="bg-slate-950/90 border-t border-slate-900 p-4 flex justify-around text-[10px] font-black sticky bottom-0 z-50 backdrop-blur">
        <button id="btn-feed" onclick="showTab('feed')" class="nav-btn text-cyan-500 flex flex-col items-center gap-1">
            <span>🏠</span> FEED
        </button>
        <button id="btn-chat" onclick="showTab('chat')" class="nav-btn text-slate-500 flex flex-col items-center gap-1">
            <span>💬</span> CHAT
        </button>
    </nav>

</body>
</html>
