<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Social Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCgB37v5kwWeYBNmkGIojTqgl_iMe4Yxfc",
            authDomain: "mlbb-hero-pick-helper.firebaseapp.com",
            projectId: "mlbb-hero-pick-helper",
            storageBucket: "mlbb-hero-pick-helper.firebasestorage.app",
            messagingSenderId: "848029333314",
            appId: "1:848029333314:web:c1c3ccacb9a5a0050ebadb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let user = JSON.parse(localStorage.getItem('mlbb_connect_user')) || null;
        let activeRoom = "Global Lobby";

        window.onload = () => {
            if(!user) document.getElementById('loginModal').classList.remove('hidden');
            else {
                updateUI();
                syncUsers();
                listenMessages();
            }
        };

        window.joinApp = async () => {
            const name = document.getElementById('nickName').value;
            if(!name) return;
            user = { id: Date.now().toString(), name, avatar: document.getElementById('avatar').value };
            localStorage.setItem('mlbb_connect_user', JSON.stringify(user));
            await setDoc(doc(db, "users", user.id), { ...user, status: "online" });
            location.reload();
        };

        function updateUI() {
            document.getElementById('navUser').innerText = user.name;
            document.getElementById('currentRoomTitle').innerText = activeRoom;
        }

        // --- USER LIST & GROUP SYSTEM ---
        function syncUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('userList');
                list.innerHTML = `<div onclick="switchRoom('Global Lobby')" class="p-3 bg-cyan-900/30 rounded-xl mb-2 cursor-pointer border border-cyan-500/30">🌍 Global Lobby</div>`;
                snap.forEach(d => {
                    const u = d.data();
                    if(u.id !== user.id) {
                        list.innerHTML += `<div class="flex items-center gap-2 p-2 hover:bg-slate-800 rounded-lg cursor-pointer text-xs">
                            <span>${u.avatar}</span> <span>${u.name}</span> <span class="w-2 h-2 bg-green-500 rounded-full ml-auto"></span>
                        </div>`;
                    }
                });
            });
        }

        window.switchRoom = (roomName) => {
            activeRoom = roomName;
            document.getElementById('currentRoomTitle').innerText = activeRoom;
            listenMessages();
        };

        // --- REAL-TIME MESSAGING ---
        window.sendChat = async () => {
            const msg = document.getElementById('chatInput').value;
            if(!msg) return;
            await addDoc(collection(db, "messages"), {
                text: msg, room: activeRoom, sender: user.name, 
                senderId: user.id, avatar: user.avatar, time: serverTimestamp()
            });
            document.getElementById('chatInput').value = "";
        };

        let unsubscribe;
        function listenMessages() {
            if(unsubscribe) unsubscribe();
            const q = query(collection(db, "messages"), orderBy("time", "asc"));
            unsubscribe = onSnapshot(q, (snap) => {
                const box = document.getElementById('chatBox');
                box.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    if(m.room === activeRoom) {
                        const isMe = m.senderId === user.id;
                        box.innerHTML += `
                            <div class="flex ${isMe ? 'justify-end' : 'justify-start'} mb-4">
                                <div class="max-w-[80%]">
                                    <div class="flex items-center gap-1 mb-1 ${isMe ? 'flex-row-reverse' : ''}">
                                        <span class="text-[10px] font-bold text-slate-500">${m.sender}</span>
                                    </div>
                                    <div class="${isMe ? 'bg-cyan-600 text-white rounded-l-2xl rounded-tr-2xl' : 'bg-slate-800 text-slate-200 rounded-r-2xl rounded-tl-2xl'} p-3 text-sm shadow-md">
                                        ${m.text}
                                    </div>
                                </div>
                            </div>`;
                    }
                });
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</head>
<body class="bg-[#020617] text-white max-w-4xl mx-auto h-screen flex flex-col font-sans">

    <div id="loginModal" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 p-8 rounded-[2rem] w-full max-w-sm border border-slate-800 text-center shadow-2xl">
            <h2 class="text-2xl font-black mb-6 text-cyan-400">Setup Chat Profile</h2>
            <select id="avatar" class="w-full bg-slate-800 p-4 rounded-2xl mb-4 text-3xl outline-none border border-slate-700">
                <option value="🦊">🦊</option><option value="🐯">🐯</option><option value="🦁">🦁</option><option value="🐼">🐼</option>
            </select>
            <input type="text" id="nickName" placeholder="နာမည်ပေးပါ..." class="w-full bg-slate-800 p-4 rounded-2xl mb-6 outline-none border border-slate-700">
            <button onclick="joinApp()" class="w-full bg-cyan-500 text-slate-950 py-4 rounded-2xl font-black shadow-lg">ENTER CHAT</button>
        </div>
    </div>

    <header class="p-4 border-b border-slate-900 flex justify-between items-center bg-slate-950/50 backdrop-blur">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
            <h1 class="font-black italic text-cyan-500 tracking-wider">MLBB CONNECT</h1>
        </div>
        <div class="text-xs font-bold bg-slate-900 px-4 py-2 rounded-full border border-slate-800">
            Hello, <span id="navUser" class="text-cyan-400"></span>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <aside class="w-1/3 border-r border-slate-900 p-4 hidden md:block overflow-y-auto">
            <h3 class="text-[10px] font-black text-slate-500 mb-4 uppercase tracking-widest">Active Users & Groups</h3>
            <div id="userList"></div>
        </aside>

        <section class="flex-1 flex flex-col">
            <div class="p-4 border-b border-slate-900 bg-slate-900/20">
                <h2 id="currentRoomTitle" class="text-sm font-bold text-cyan-400">Global Lobby</h2>
            </div>
            
            <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-2 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">
                </div>

            <div class="p-4 bg-slate-950 border-t border-slate-900">
                <div class="flex gap-2">
                    <input type="text" id="chatInput" placeholder="Write a message..." class="flex-1 bg-slate-900 p-4 rounded-2xl outline-none border border-slate-800 text-sm focus:border-cyan-500 transition-all">
                    <button onclick="sendChat()" class="bg-cyan-600 hover:bg-cyan-500 px-8 rounded-2xl font-bold transition-all shadow-lg active:scale-95">SEND</button>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
