<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Zwel Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPhoneNumber, RecaptchaVerifier } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCgB37v5kwWeYBNmkGIojTqgl_iMe4Yxfc",
            authDomain: "mlbb-hero-pick-helper.firebaseapp.com",
            projectId: "mlbb-hero-pick-helper",
            storageBucket: "mlbb-hero-pick-helper.firebasestorage.app",
            messagingSenderId: "848029333314",
            appId: "1:848029333314:web:c1c3ccacb9a5a0050ebadb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let cart = [];
        let isStoreManager = false; // Admin ဟုတ်မဟုတ် စစ်ရန်

        window.onload = () => {
            loadProducts();
            checkAdminStatus();
        };

        // --- 1. USER AUTH (PHONE LOGIN) ---
        window.setupRecaptcha = () => {
            window.recaptchaVerifier = new RecaptchaVerifier(auth, 'sign-in-button', { 'size': 'invisible' });
        };

        window.sendOTP = async () => {
            const phone = document.getElementById('phoneInput').value;
            setupRecaptcha();
            const appVerifier = window.recaptchaVerifier;
            const confirmationResult = await signInWithPhoneNumber(auth, phone, appVerifier);
            window.confirmationResult = confirmationResult;
            document.getElementById('otpArea').classList.remove('hidden');
        };

        // --- 2. ADMIN PANEL (PRODUCT MGMT) ---
        window.toggleAdmin = () => {
            const pass = prompt("Admin Password ရိုက်ပါ:");
            if(pass === "admin123") {
                isStoreManager = true;
                document.getElementById('adminPanel').classList.remove('hidden');
            }
        };

        window.addProduct = async () => {
            const name = document.getElementById('pName').value;
            const price = Number(document.getElementById('pPrice').value);
            const img = document.getElementById('pImg').value;
            const desc = document.getElementById('pDesc').value;

            await addDoc(collection(db, "products"), { name, price, image: img, desc, time: serverTimestamp() });
            alert("ပစ္စည်းအသစ် တင်ပြီးပါပြီ!");
        };

        // --- 3. PRODUCT LIST & CART ---
        function loadProducts() {
            onSnapshot(query(collection(db, "products"), orderBy("time", "desc")), (snap) => {
                const list = document.getElementById('productList');
                list.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    list.innerHTML += `
                        <div class="bg-white p-3 rounded-2xl shadow-md border border-slate-100">
                            <img src="${p.image}" class="w-full h-32 object-cover rounded-xl mb-2">
                            <h3 class="font-bold text-sm truncate">${p.name}</h3>
                            <p class="text-orange-500 font-black text-xs">${p.price} MMK</p>
                            <button onclick="addToCart('${p.name}', ${p.price})" class="w-full bg-orange-500 text-white py-2 rounded-lg mt-2 text-[10px] font-bold">ADD TO CART</button>
                            ${isStoreManager ? `<button onclick="deleteProduct('${d.id}')" class="text-red-500 text-[9px] mt-1 underline">Delete</button>` : ''}
                        </div>`;
                });
            });
        }

        window.addToCart = (n, p) => {
            cart.push({name: n, price: p});
            document.getElementById('cartCount').innerText = cart.length;
        };

        // --- 4. ORDER & PAYMENT (KPay/Wave) ---
        window.checkout = async () => {
            if(cart.length === 0) return alert("ဈေးခြင်းတောင်းထဲ ပစ္စည်းထည့်ပါ");
            
            const total = cart.reduce((s, i) => s + i.price, 0);
            const paymentType = confirm("KPay/Wave ဖြင့် ပေးချေမှာလား? (OK = Yes, Cancel = Cash on Delivery)");
            
            const orderData = {
                items: cart,
                total: total,
                payment: paymentType ? "Mobile Banking" : "COD" : "KBZ pay",
                status: "Pending",
                customer: auth.currentUser?.09429991957 || "Guest",
                time: serverTimestamp()
            };

            await addDoc(collection(db, "orders"), orderData);
            
            if(paymentType) {
                alert(`စုစုပေါင်း ${total} ကျပ်ကို KPay: 09429991957 သို့ လွှဲပေးပါ။ Order တင်ပြီးပါပြီ!`);
            } else {
                alert("Order တင်ခြင်း အောင်မြင်ပါသည်။");
            }
            cart = [];
            document.getElementById('cartCount').innerText = "0";
        };

        // --- 5. ORDER CHECKING (ADMIN) ---
        window.viewOrders = () => {
            document.getElementById('orderModal').classList.remove('hidden');
            onSnapshot(query(collection(db, "orders"), orderBy("time", "desc")), (snap) => {
                const oList = document.getElementById('orderList');
                oList.innerHTML = "";
                snap.forEach(d => {
                    const o = d.data();
                    oList.innerHTML += `
                        <div class="p-3 bg-slate-50 rounded-xl mb-2 border-l-4 border-orange-500 text-[10px]">
                            <p><b>Phone:</b> ${o.customer}</p>
                            <p><b>Items:</b> ${o.items.length} ခု</p>
                            <p><b>Total:</b> ${o.total} MMK (${o.payment})</p>
                            <button class="bg-green-500 text-white px-2 py-1 rounded mt-1">Confirm Order</button>
                        </div>`;
                });
            });
        };
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <header class="bg-white p-4 sticky top-0 z-40 flex justify-between items-center shadow-sm border-b border-slate-200">
        <h1 class="text-xl font-black text-orange-600 italic">MEGA STORE</h1>
        <div class="flex gap-4 items-center">
            <button onclick="toggleAdmin()" class="text-[10px] text-slate-400">Admin</button>
            <div onclick="checkout()" class="relative cursor-pointer bg-slate-100 p-2 rounded-full">
                🛒 <span id="cartCount" class="absolute -top-1 -right-1 bg-orange-600 text-white text-[8px] px-1.5 rounded-full">0</span>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <section id="adminPanel" class="hidden bg-white p-5 rounded-3xl mb-6 shadow-xl border-2 border-orange-500">
            <h2 class="text-sm font-bold mb-4 text-orange-600">Admin: Add Product</h2>
            <input type="text" id="pName" placeholder="Product Name" class="w-full bg-slate-100 p-3 rounded-xl mb-2 text-xs outline-none">
            <input type="number" id="pPrice" placeholder="Price (MMK)" class="w-full bg-slate-100 p-3 rounded-xl mb-2 text-xs outline-none">
            <input type="text" id="pImg" placeholder="Image URL" class="w-full bg-slate-100 p-3 rounded-xl mb-2 text-xs outline-none">
            <textarea id="pDesc" placeholder="Description" class="w-full bg-slate-100 p-3 rounded-xl mb-3 text-xs outline-none"></textarea>
            <div class="flex gap-2">
                <button onclick="addProduct()" class="flex-1 bg-orange-600 text-white py-3 rounded-xl font-bold text-xs">Add Product</button>
                <button onclick="viewOrders()" class="flex-1 bg-slate-800 text-white py-3 rounded-xl font-bold text-xs">Check Orders</button>
            </div>
        </section>

        <h2 class="font-black text-lg mb-4 text-slate-800 tracking-tight">Daily Picks</h2>
        <div id="productList" class="grid grid-cols-2 gap-3"></div>
    </main>

    <div id="orderModal" class="fixed inset-0 bg-black/50 z-[100] hidden p-6 overflow-y-auto">
        <div class="bg-white p-6 rounded-[2rem] w-full">
            <div class="flex justify-between mb-4">
                <h2 class="font-bold">Recent Orders</h2>
                <button onclick="document.getElementById('orderModal').classList.add('hidden')" class="text-red-500 font-bold">Close</button>
            </div>
            <div id="orderList"></div>
        </div>
    </div>

</body>
</html>
