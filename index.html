<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB AI Screenshot Draft Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border: 1px solid #334155; }
        .loader { border: 4px solid #1e293b; border-top: 4px solid #06b6d4; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .item-box { width: 50px; height: 50px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; }
    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <div class="w-full max-w-lg">
        <header class="text-center my-8">
            <h1 class="text-3xl font-black text-cyan-400 italic italic tracking-tighter">MLBB DRAFT PICK HELPER </h1>
            <p class="text-slate-500 text-[10px] uppercase tracking-widest">Feb 2026 Meta Analysis</p>
        </header>

        <div class="glass p-8 rounded-3xl text-center border-dashed border-2 border-slate-700">
            <p class="text-sm text-slate-400 mb-4 font-medium">Screenshot ကို ရိုက်ပြီး ဒီမှာ တင်လိုက်ပါ</p>
            <input type="file" id="screenshotInput" accept="image/*" class="hidden">
            <button onclick="document.getElementById('screenshotInput').click()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-black py-4 px-8 rounded-2xl w-full shadow-lg transition-all active:scale-95">
                UPLOAD SCREENSHOT
            </button>
            
            <div id="loading" class="hidden flex flex-col items-center mt-6">
                <div class="loader mb-2"></div>
                <p class="text-xs text-cyan-400 animate-pulse">AI is scanning heroes...</p>
            </div>
        </div>

        <div class="mt-6 flex gap-4">
            <select id="userLane" class="flex-1 bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none">
                <option value="Jungle">Your Role: Jungle</option>
                <option value="Gold Lane">Your Role: Gold Lane</option>
                <option value="EXP Lane">Your Role: EXP Lane</option>
                <option value="Mid Lane">Your Role: Mid Lane</option>
                <option value="Roam">Your Role: Roam</option>
            </select>
        </div>

        <div id="result" class="hidden mt-8 glass p-6 rounded-3xl border-t-4 border-green-400 animate-in fade-in duration-700">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-16 h-16 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center font-black text-2xl text-white shadow-lg" id="resInitial">?</div>
                <div>
                    <p class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest">Meta Recommendation</p>
                    <h2 id="resHero" class="text-3xl font-black text-white leading-tight">--</h2>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                    <p class="text-[10px] text-gray-500 font-bold mb-1">EMBLEM</p>
                    <p id="resEmblem" class="text-xs font-bold text-white">--</p>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                    <p class="text-[10px] text-gray-500 font-bold mb-1">BATTLE SPELL</p>
                    <p id="resSpell" class="text-xs font-bold text-white">--</p>
                </div>
            </div>

            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                <p class="text-[10px] text-gray-500 font-bold mb-3 uppercase">Counter Build Items</p>
                <div id="itemIcons" class="flex gap-2">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('screenshotInput');
        
        input.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');

            Tesseract.recognize(file, 'eng', { logger: m => console.log(m) })
            .then(({ data: { text } }) => {
                analyzeOCR(text.toLowerCase());
            })
            .finally(() => {
                document.getElementById('loading').classList.add('hidden');
            });
        });

        function analyzeOCR(text) {
            const lane = document.getElementById('userLane').value;
            let rec = { name: "Martis", emblem: "Assassin (Season Master)", spell: "Retri", items: ["Sky Piercer", "Hunter Strike", "DHS"] };

            // Logic matching for 2026 Meta
            if(text.includes("sora") || text.includes("ling")) {
                if(lane === "EXP Lane") rec = { name: "Phoveus", emblem: "Fighter (Brave Smite)", spell: "Vengeance", items: ["Clock of Destiny", "Oracle", "Antique Cuirass"] };
                if(lane === "Jungle") rec = { name: "Hayabusa", emblem: "Assassin", spell: "Retri", items: ["Sky Piercer", "Hunter Strike", "Malefic Roar"] };
            } else if(text.includes("franco") || text.includes("atlas")) {
                rec = { name: "Diggie", emblem: "Support", spell: "Flicker", items: ["Flask of Oasis", "Fleeting Time", "Oracle"] };
            } else if(lane === "Gold Lane") {
                rec = { name: "Ixia", emblem: "Marksman (Quantum Charge)", spell: "Flicker", items: ["Corrosion Scythe", "Golden Staff", "Demon Hunter"] };
            }

            // Display Results
            document.getElementById('resHero').innerText = rec.name;
            document.getElementById('resInitial').innerText = rec.name.charAt(0);
            document.getElementById('resEmblem').innerText = rec.emblem;
            document.getElementById('resSpell').innerText = rec.spell;

            const items = document.getElementById('itemIcons');
            items.innerHTML = '';
            rec.items.forEach(i => {
                const box = document.createElement('div');
                box.className = 'item-box flex items-center justify-center text-[7px] text-center font-bold p-1 leading-tight text-white uppercase';
                box.innerText = i;
                items.appendChild(box);
            });

            document.getElementById('result').classList.remove('hidden');
        }
    </script>
</body>
</html>
