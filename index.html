<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Social AI (Cloud Saved)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // အောက်က နေရာမှာ သင့် Firebase Project က Config တွေကို အစားထိုးပါ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- GLOBAL FUNCTIONS ---
        window.createPost = async () => {
            const text = document.getElementById('postText').value;
            if(!text) return;
            await addDoc(collection(db, "posts"), {
                text: text,
                timestamp: serverTimestamp()
            });
            document.getElementById('postText').value = "";
        };

        // Real-time Listen to Posts
        onSnapshot(query(collection(db, "posts"), orderBy("timestamp", "desc")), (snapshot) => {
            const container = document.getElementById('postContainer');
            container.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = "p-4 bg-slate-800 rounded-xl mb-3 border border-slate-700";
                card.innerHTML = `<p class="text-sm text-cyan-400 font-bold mb-1">User</p><p class="text-sm">${data.text}</p>`;
                container.appendChild(card);
            });
        });

        window.sendMessage = async () => {
            const msg = document.getElementById('chatInput').value;
            if(!msg) return;
            await addDoc(collection(db, "chats"), {
                text: msg,
                timestamp: serverTimestamp()
            });
            document.getElementById('chatInput').value = "";
        };

        onSnapshot(query(collection(db, "chats"), orderBy("timestamp", "asc")), (snapshot) => {
            const box = document.getElementById('chatMessages');
            box.innerHTML = "";
            snapshot.forEach((doc) => {
                const div = document.createElement('div');
                div.className = "bg-slate-900 p-2 rounded mb-2 text-xs";
                div.innerHTML = `<span class="text-blue-400 font-bold">User:</span> ${doc.data().text}`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    </script>
    <style>
        body { background: #020617; color: white; }
        .nav-btn { flex: 1; padding: 15px; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; }
        .nav-active { border-bottom: 2px solid #06b6d4; color: #06b6d4; }
    </style>
</head>
<body class="max-w-md mx-auto">
    <nav class="flex bg-slate-900 sticky top-0 z-50">
        <div onclick="showTab('ai')" id="btn-ai" class="nav-btn nav-active">AI Helper</div>
        <div onclick="showTab('feed')" id="btn-feed" class="nav-btn">Feed</div>
        <div onclick="showTab('chat')" id="btn-chat" class="nav-btn">Chat</div>
    </nav>

    <div id="tab-ai" class="p-4">
        <h2 class="text-center font-black text-cyan-500 mb-4">MLBB AI COUNTER</h2>
        <input type="file" id="fileInput" class="hidden">
        <button onclick="document.getElementById('fileInput').click()" class="w-full bg-slate-800 py-3 rounded-xl mb-4">Choose Screenshot</button>
        <button onclick="processAnalysis()" class="w-full py-4 bg-cyan-600 rounded-xl font-bold">Analyze Match</button>
    </div>

    <div id="tab-feed" class="p-4 hidden">
        <textarea id="postText" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white mb-2" placeholder="Post တင်မယ်..."></textarea>
        <button onclick="createPost()" class="w-full bg-blue-600 py-2 rounded-xl mb-4">Post</button>
        <div id="postContainer"></div>
    </div>

    <div id="tab-chat" class="p-4 hidden">
        <div id="chatMessages" class="h-64 overflow-y-auto bg-slate-900 p-4 rounded-xl mb-4"></div>
        <div class="flex gap-2">
            <input type="text" id="chatInput" class="flex-1 bg-slate-800 p-2 rounded-lg" placeholder="Say something...">
            <button onclick="sendMessage()" class="bg-cyan-600 px-4 rounded-lg">Send</button>
        </div>
    </div>

    <script>
        function showTab(t) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('nav-active'));
            document.getElementById('tab-' + t).classList.remove('hidden');
            document.getElementById('btn-' + t).classList.add('nav-active');
        }
    </script>
</body>
</html>
