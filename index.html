<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Counter Tool 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .main-card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 1.5rem; }
        select { background: #0f172a; border: 1px solid #475569; color: white; width: 100%; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
        .btn-go { background: linear-gradient(to right, #06b6d4, #3b82f6); width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-center mb-6 text-cyan-400">MLBB COUNTER PICK 2026</h1>

        <div class="main-card shadow-2xl">
            <label class="block text-sm mb-2">Enemy Picked Hero:</label>
            <select id="enemyHero">
                <option value="Sora">Sora (OP Fighter)</option>
                <option value="Gloo">Gloo (Tank Meta)</option>
                <option value="Ixia">Ixia (Gold Lane)</option>
                <option value="Zetian">Zetian (New Mage)</option>
                <option value="Hayabusa">Hayabusa (Revamped)</option>
                <option value="Helcurt">Helcurt (Assasin)</option>
                <option value="Kalea">Kalea (Support)</option>
            </select>

            <label class="block text-sm mb-2">Your Lane:</label>
            <select id="myLane">
                <option value="Jungle">Jungle</option>
                <option value="EXP Lane">EXP Lane</option>
                <option value="Gold Lane">Gold Lane</option>
                <option value="Mid Lane">Mid Lane</option>
                <option value="Roam">Roam</option>
            </select>

            <button onclick="startCounter()" class="btn-go uppercase tracking-wider">Get Counter Suggestion</button>
        </div>

        <div id="resultBox" class="hidden mt-6 p-5 border-l-4 border-cyan-400 bg-slate-800 rounded-lg">
            <h2 class="text-gray-400 text-xs font-bold uppercase">Use this Hero:</h2>
            <div id="recHeroName" class="text-3xl font-black text-white my-2">--</div>
            
            <div class="grid grid-cols-2 gap-2 mt-4">
                <div class="bg-slate-900 p-2 rounded">
                    <p class="text-[10px] text-cyan-400">EMBLEM</p>
                    <p id="recEmblem" class="text-sm font-bold">--</p>
                </div>
                <div class="bg-slate-900 p-2 rounded">
                    <p class="text-[10px] text-cyan-400">SPELL</p>
                    <p id="recSpell" class="text-sm font-bold">--</p>
                </div>
            </div>

            <div class="bg-slate-900 p-3 rounded mt-2">
                <p class="text-[10px] text-cyan-400 font-bold mb-1 uppercase">Recommended Items:</p>
                <p id="recItems" class="text-xs italic text-gray-300">--</p>
            </div>
        </div>
    </div>

    <script>
        const database = {
            "Sora": {
                "EXP Lane": { name: "Phoveus", emblem: "Fighter (Brave Smite)", spell: "Vengeance", items: "Tough Boots, Clock of Destiny, Oracle" },
                "Jungle": { name: "Hayabusa", emblem: "Assassin (Lethal Ignition)", spell: "Retribution", items: "Sky Piercer, Hunter Strike, Malefic Roar" },
                "Roam": { name: "Minsitthar", emblem: "Tank (Tenacity)", spell: "Flicker", items: "Dominance Ice, Antique Cuirass" }
            },
            "Zetian": {
                "Mid Lane": { name: "Kagura", emblem: "Mage (Lethal Ignition)", spell: "Execute", items: "Arcane Boots, Lightning Truncheon, Holy Crystal" },
                "Roam": { name: "Diggie", emblem: "Support (Pull Yourself Together)", spell: "Flicker", items: "Flask of Oasis, Fleeting Time" }
            },
            "Ixia": {
                "Gold Lane": { name: "Claude", emblem: "Marksman (Quantum Charge)", spell: "Vengeance", items: "Corrosion Scythe, DHS, Golden Staff" }
            },
            "default": {
                "Jungle": { name: "Fredrinn", emblem: "Tank (Shockwave)", spell: "Retri", items: "Cursed Helmet, Guardian Helmet" },
                "Gold Lane": { name: "Karrie", emblem: "Marksman (Weakness Finder)", spell: "Flicker", items: "Corrosion Scythe, Golden Staff" },
                "EXP Lane": { name: "Terizla", emblem: "Fighter (Festival of Blood)", spell: "Flicker", items: "Bloodlust Axe, Dominance Ice" },
                "Mid Lane": { name: "Vexana", emblem: "Mage (Lethal Ignition)", spell: "Flicker", items: "Enchanted Talisman, Glowing Wand" },
                "Roam": { name: "Tigreal", emblem: "Tank (Concussive Blast)", spell: "Flicker", items: "Dominance Ice, Athena Shield" }
            }
        };

        function startCounter() {
            const enemy = document.getElementById('enemyHero').value;
            const lane = document.getElementById('myLane').value;
            const display = document.getElementById('resultBox');

            let pick = (database[enemy] && database[enemy][lane]) ? database[enemy][lane] : database["default"][lane];

            document.getElementById('recHeroName').innerText = pick.name;
            document.getElementById('recEmblem').innerText = pick.emblem;
            document.getElementById('recSpell').innerText = pick.spell;
            document.getElementById('recItems').innerText = pick.items;

            display.classList.remove('hidden');
        }
    </script>
</body>
</html>
